apiVersion: v1
kind: Pod
metadata:
  name: env-pod
  labels:
    app: env-pod
spec:
 containers:
  - name: nginx-cont
    image: nginx:latest
    ports:
     - containerPort: 80
    command: ["sh","-c"]
    args: 
      - |
        echo "App_Name=$App_Name"
        echo "APP_Env $App_Env"
    env:
      - name: App_Name
        value: "kubernetes"
      - name: App_Env
        value: "dev"    
