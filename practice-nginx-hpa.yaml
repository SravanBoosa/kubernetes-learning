apiVersion: autoscaling/v2
kind: HorozontalPosAutoscaler
metadata:
  name: nginx-deployment
spec:
 scaleTargetRef:
   apiVersion: apps/v1
   kind: Deployment
 minReplicas: 1
 maxReplicas: 3
 metrics:
  - type: Resource
    resource:
     name: cpu
     target:
       type: Utilization
       averageUtilization: 80 
