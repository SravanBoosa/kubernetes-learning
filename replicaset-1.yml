apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-app-replicaset
  labels:
      app: my-app
      type: front-end
spec:
  template:
    metadata:
      name: my-app-pod1
      labels:
          app: my-app
          type: front-end
    spec:
      containers:
        - name: nginx-container
          image: nginx
  replicas: 1 
  selector:
    matchLabels:
       app: my-app


