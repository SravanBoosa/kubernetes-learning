apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-frontend
  labels: 
    type: front-end
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1  
  replicas: 2
  template:
    metadata:
      name: httpd-pod
      labels:
        type: front-end
    spec:
      containers: 
       - name: httpd-frontend
         image: httpd:2.4-alpine
  selector:
    matchLabels:
      type: front-end

      
