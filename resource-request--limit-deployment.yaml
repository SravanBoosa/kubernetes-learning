apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-request-limit-deploy-practice
spec:
 replicas: 2
 selector:
   matchLabels: 
     name: resource-deploy-practice  
 template:
   metadata: 
     labels:
       name: resource-deploy-practice
   spec:    
     containers:
      - name: nginx
        image: nginx:stable
        ports:
         - containerPort: 80  
        resources:
          requests:  
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "300m"
            memory: "200Mi"    

