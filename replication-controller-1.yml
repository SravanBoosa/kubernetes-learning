apiVersion: v1
kind: ReplicationController
metadata:
  name: my-app-rc
  labels:
     app: my-app
     type: front-end
spec:
  replicas: 1
  template:
      metadata:
        name: my-app-pod
        labels:
          app: my-app
          type: front-end
      spec:
        containers:
            - name: nginx-container
              image: nginx  


